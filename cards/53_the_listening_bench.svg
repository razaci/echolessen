<text x="85" y="498" class="head">ANCHOR · EXPECTATION</text><text x="85" y="529" class="body">the cedar doorway and the return trail</text>
<text x="80" y="618" class="head">STORY DISCOVERY</text><text x="80" y="652" class="body">At the twenty-four-step stair, use the cedar doorway</text><text x="80" y="677" class="body">and the return trail to test a question through the</text><text x="80" y="702" class="body">lens of expectation.</text>
<text x="80" y="751" class="head">MACRO → MICRO → NANO</text>
<text x="80" y="783" class="body">Whole camp: Examine how the listening bench changes</text><text x="80" y="807" class="body">the organization, shared meaning, or relationships of</text>
<text x="80" y="840" class="body">One person: Follow one participant encountering the</text><text x="80" y="864" class="body">listening bench</text>
<text x="80" y="897" class="body">Small process: Select one small perceptual or</text><text x="80" y="921" class="body">physiological process relevant to expectation</text>
<rect x="67" y="955" width="616" height="105" rx="8" fill="#e8d8bd"/>
<text x="83" y="984" class="head">CARD MISSION</text><text x="83" y="1011" class="body">Describe one everyday situation; ask a expectation</text><text x="83" y="1034" class="body">question, offer two alternative readings, then</text>
<text x="375" y="1080" class="small">Observe · Question · Compare · Return</text></svg>