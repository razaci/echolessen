<text x="375" y="85" class="small">ECHO · THE LIVING TABERNACLE</text><text x="375" y="124" class="small">LESSON 53 / 90 · IVORY &amp; COPPER</text>
<text x="375" y="170" class="title">THE LISTENING BENCH</text>
